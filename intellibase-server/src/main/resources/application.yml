server:
  port: 8080

spring:
  application:
    name: intellibase-server
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/intellibase
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: redis

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true

jwt:
  secret: Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXNlY3VyZS1rZXktaW4tcHJvZHVjdGlvbi0yMDI2
  expiration: 86400000  # 24 hours in milliseconds

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

llm:
  api-key: ${OPENAI_API_KEY:test-openai-key}
  base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
  model-name: ${LLM_MODEL_NAME:gpt-4o-mini}
  temperature: 0.7
  max-tokens: 32768

rag:
  retrieval-top-k: 5
  similarity-threshold: 0.4
  cache-similarity-threshold: 0.95
  l2-retrieval-cache-ttl-minutes: 30
  hybrid:
    default-preset: GENERAL_QA
    pipeline-version: 2
    dense-similarity-threshold: 0.25
    rrf-k: 60
    general-qa:
      hybrid-enabled: true
      rerank-enabled: true
      dense-top-k: 20
      sparse-top-k: 20
      fusion-top-k: 15
      final-top-k: 5
      dense-weight: 0.55
      sparse-weight: 0.45
    exact-lookup:
      hybrid-enabled: true
      rerank-enabled: true
      dense-top-k: 10
      sparse-top-k: 30
      fusion-top-k: 15
      final-top-k: 5
      dense-weight: 0.35
      sparse-weight: 0.65
    longform-synthesis:
      hybrid-enabled: true
      rerank-enabled: true
      dense-top-k: 30
      sparse-top-k: 15
      fusion-top-k: 20
      final-top-k: 8
      dense-weight: 0.65
      sparse-weight: 0.35
  query-rewrite:
    enabled: ${RAG_QUERY_REWRITE_ENABLED:false}
    min-length: 18
    hyde-enabled: ${RAG_HYDE_ENABLED:false}
  rerank:
    external-enabled: ${RAG_RERANK_EXTERNAL_ENABLED:false}
    api-url: ${RAG_RERANK_API_URL:}
    api-key: ${RAG_RERANK_API_KEY:}
    model: ${RAG_RERANK_MODEL:bge-reranker-v2-m3}

embedding:
  api-key: ${OPENAI_API_KEY:test-openai-key}
  base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
  model-name: text-embedding-v4
  dimensions: 1536

ocr:
  enabled: ${OCR_ENABLED:true}
  provider: aliyun
  aliyun:
    access-key-id: ${ALIYUN_OCR_AK:}
    access-key-secret: ${ALIYUN_OCR_SK:}
    endpoint: ocr-api.cn-shanghai.aliyuncs.com
  pdf-fallback:
    min-chars-per-page: 50
  image:
    max-dimension: 4096
    max-size-mb: 4
    render-dpi: 200

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: intellibase

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true
    db:
      enabled: true
